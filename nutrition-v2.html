<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PUMP · תזונה V2</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif;background:#111;color:#fff}*{box-sizing:border-box}body{margin:0;background:#111}main{max-width:620px;margin:auto;padding:26px 18px 92px}.kicker{color:#ff7b21;font-size:12px;font-weight:800;letter-spacing:.08em}h1{font-size:32px;margin:7px 0}p{color:#b8b8b8;line-height:1.5}.target{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.target>div,.meal{border:1px solid #2f2f2f;border-radius:18px;background:#181818;padding:15px}.target small,.meal small{color:#aaa}.target b{display:block;font-size:24px;margin-top:3px}.meal{margin:12px 0}.meta{display:flex;justify-content:space-between;gap:12px}.meta b{font-size:14px}.meta span{color:#aaa;font-size:12px}.meal h2{margin:12px 0 4px;font-size:19px}.meal p{margin:0 0 10px;font-size:14px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.primary,.secondary{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:800}.primary{background:#ff6b00;color:#fff}.secondary{background:#292929;color:#fff}.done{border-color:#25c66b;background:linear-gradient(135deg,#15241a,#171717)}.done .meta b{color:#77e89d}.notice{margin:18px 0;padding:12px;border-radius:12px;background:#222;color:#f0c9ae}.error{color:#ff9a9a}.loading{padding:45px 0;text-align:center;color:#aaa}
  </style>
</head>
<body><main id="app"><div class="loading">טוענים את התפריט…</div></main>
<script>
(() => {
  const app = document.querySelector('#app');
  const SB = 'https://aebysqjymsjepvslidjl.supabase.co';
  const KEY = 'sb_publishable_DlOsq6M0Wrwl_9lIH1qvQQ_bKJxwgNg';
  const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const session = () => { try { for (let i=0;i<localStorage.length;i+=1) { const k=localStorage.key(i); if (!k?.includes('auth-token')) continue; const v=JSON.parse(localStorage.getItem(k)||'{}'); const s=v.currentSession||v.session||v; if (s?.access_token&&s?.user?.id) return s; } } catch (_) {} return null; };
  const api = async (path, token, init={}) => { const r=await fetch(`${SB}/rest/v1/${path}`,{...init,headers:{apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(init.headers||{})}}); if(!r.ok) throw Error('לא הצלחנו לשמור את הנתונים.'); return r.status===204?null:r.json(); };
  const target = p => { const bmr=10*Number(p.start_weight)+6.25*Number(p.height)-5*Number(p.age)+(p.sex==='male'?5:-161); const mult={low:1.2,light:1.375,medium:1.55}[p.activity]||1.375; const gain=p.goal==='gain'||(p.goal==='event'&&Number(p.target_weight)>Number(p.start_weight)); const delta=gain?(p.pace==='steady'?250:350):(p.pace==='steady'?-350:-500); return { calories:Math.max(1200,Math.round((bmr*mult+delta)/50)*50), protein:Math.round(Number(p.start_weight)*(gain&&p.training_level==='experienced'?1.8:1.6)) }; };
  const choices = { main:[['ארוחה עם עוף ואורז','חזה עוף, אורז וירקות.'],['פסטה עם טונה','פסטה, טונה, ירקות ושמן זית.'],['קציצות עם תפוחי אדמה','בשר, תפוחי אדמה וסלט.']], snack:[['פרי וסקיר / יוגורט PRO','פרי אחד עם סקיר או יוגורט חלבון.'],['כריך קטן עם חלבון','לחם מלא עם קוטג׳, טונה או ביצה.'],['אגוזים ופרי','חופן קטן של אגוזים עם פרי.']] };
  const state = { selected:{}, saved:{}, profile:null, plan:null };
  const planFor = p => { let saved={}; try { saved=JSON.parse(localStorage.getItem('pump-meal-structure-v1')||'{}').plan||{}; } catch(_) {} const two=saved.pattern==='two'||(!saved.pattern&&p.meal_pattern==='two'); const snacks=saved.snacks|| (two?2:1); const mains=two?2:3; const goals=target(p); const snackCalories=snacks===2?420:170; const snackProtein=snacks===2?38:18; return { mains,snacks,goals,mainCalories:Math.round((goals.calories-snackCalories)/mains/10)*10,mainProtein:Math.max(1,Math.round((goals.protein-snackProtein)/mains)),snackCalories:snacks===2?[170,250]:[170],snackProtein:snacks===2?[18,20]:[18] }; };
  const cards = () => { const p=state.plan, out=[]; for(let i=0;i<p.mains;i+=1) out.push({key:`v2-main-${i}`,timing:['בוקר','צהריים','ערב'][i]||'ארוחה עיקרית',type:'main',calories:p.mainCalories,protein:p.mainProtein,label:'ארוחה עיקרית מותאמת'}); for(let i=0;i<p.snacks;i+=1) out.push({key:`v2-snack-${i}`,timing:`ארוחת ביניים ${i+1}`,type:'snack',calories:p.snackCalories[i],protein:p.snackProtein[i],label:'שומרים על שובע בין הארוחות'}); return out; };
  const option = card => { const index=state.selected[card.key]||0, data=choices[card.type][index%choices[card.type].length]; return { index,title:data[0],detail:data[1] }; };
  const render = () => { const p=state.plan, eaten=Object.values(state.saved).reduce((s,x)=>s+Number(x.calories),0), protein=Object.values(state.saved).reduce((s,x)=>s+Number(x.protein),0); app.innerHTML=`<div class="kicker">תזונה V2 · גרסת בדיקה</div><h1>התפריט שלך להיום</h1><p>${p.mains} ארוחות עיקריות + ${p.snacks} ארוחות ביניים. היעד מתחלק מראש בין כולן.</p><section class="target"><div><small>נאכלו היום</small><b>${eaten} קל׳</b></div><div><small>חלבון</small><b>${protein} / ${p.goals.protein} ג׳</b></div></section><div id="meals"></div><p class="notice">זוהי גרסת בדיקה מבודדת: אפשר לסמן, לבטל ולהחליף בלי לגעת במסך הישן.</p>`; const list=document.querySelector('#meals'); cards().forEach(card=>{ const saved=state.saved[card.key], item=option(card), article=document.createElement('article'); article.className=`meal${saved?' done':''}`; article.innerHTML=`<div class="meta"><b>${saved?'✓ ':''}${card.timing}</b><span>${saved?'נשמר להיום':`חלופה ${item.index+1} מתוך 3`}</span></div><p>${card.label}</p><h2>${item.title}</h2><p>${item.detail}</p><small>כ־${card.protein} גרם חלבון · כ־${card.calories} קל׳</small><div class="actions"><button class="secondary">${saved?'ביטול':'↻ החלפה'}</button><button class="primary">${saved?'✓ נאכל היום':'✓ אכלתי'}</button></div>`; const [swap,action]=article.querySelectorAll('button'); swap.onclick=()=>saved?remove(card):replace(card); action.onclick=()=>saved?remove(card):save(card,item); list.append(article); }); };
  const replace = card => { state.selected[card.key]=(state.selected[card.key]||0)+1; render(); };
  const save = async (card,item) => { try { const s=session(), day=localDate(); if(!s) throw Error('צריך להתחבר לחשבון כדי לבדוק שמירה.'); await api(`food_entries?user_id=eq.${s.user.id}&date=eq.${day}&menu_key=eq.${card.key}`,s.access_token,{method:'DELETE'}); await api('food_entries',s.access_token,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:s.user.id,date:day,name:item.title,calories:card.calories,protein:card.protein,menu_key:card.key})}); await api('meal_actions?on_conflict=user_id,date,meal_key',s.access_token,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:s.user.id,date:day,meal_key:card.key,status:'done',selected_option:item.index})}); state.saved[card.key]={calories:card.calories,protein:card.protein}; render(); } catch(e) { app.insertAdjacentHTML('afterbegin',`<p class="notice error">${e.message}</p>`); } };
  const remove = async card => { try { const s=session(),day=localDate(); if(!s) throw Error('צריך להתחבר לחשבון.'); await api(`food_entries?user_id=eq.${s.user.id}&date=eq.${day}&menu_key=eq.${card.key}`,s.access_token,{method:'DELETE'}); await api(`meal_actions?user_id=eq.${s.user.id}&date=eq.${day}&meal_key=eq.${card.key}`,s.access_token,{method:'DELETE'}); delete state.saved[card.key]; render(); } catch(e) { app.insertAdjacentHTML('afterbegin',`<p class="notice error">${e.message}</p>`); } };
  const init = async () => { try { const s=session(); if(!s) throw Error('יש להתחבר קודם ל־PUMP, ואז לפתוח את דף הבדיקה.'); const p=await api(`profiles?select=*&id=eq.${s.user.id}`,s.access_token); state.profile=p[0]; if(!state.profile) throw Error('לא נמצא פרופיל משתמש.'); state.plan=planFor(state.profile); const rows=await api(`food_entries?select=menu_key,calories,protein&user_id=eq.${s.user.id}&date=eq.${localDate()}&menu_key=like.v2-*`,s.access_token); rows.forEach(x=>state.saved[x.menu_key]=x); render(); } catch(e) { app.innerHTML=`<p class="notice error">${e.message}</p>`; } };
  init();
})();
</script></body></html>
