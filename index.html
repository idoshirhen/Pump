<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="PUMP — תזונה, אימונים ומעקב אישי לעלייה או ירידה במשקל." />
    <link rel="icon" href="/Pump/pump-logo-favicon.png" />
    <title>PUMP</title>
    <script type="module" crossorigin src="/Pump/assets/index-sAZdQ5Fq.js"></script>
    <link rel="stylesheet" crossorigin href="/Pump/assets/index-dgUwtq-o.css">
  </head>
  <body>
    <div id="root"></div>
    <style>
      /* Keep the chosen weigh-in chart flat and legible on every device. */
      .weight-chart-line {
        fill: none !important;
        stroke: #24c66b !important;
        stroke-width: 2.2px !important;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: none !important;
      }
      .weight-chart-point {
        fill: #111 !important;
        stroke: #24c66b !important;
        filter: none !important;
      }
    </style>
    <script>
      (() => {
        const cleanNutritionUi = () => {
          document.querySelectorAll('.plate-card.compact, .top-actions .ai-orb, .meal-skip').forEach((element) => element.remove());
          document.querySelectorAll('.toast').forEach((toast) => {
            if (toast.textContent?.trim() === 'החלופה נשמרה להיום.') {
              toast.textContent = 'החלפנו לאפשרות אחרת.';
            }
          });
        };

        new MutationObserver(cleanNutritionUi).observe(document.documentElement, { childList: true, subtree: true });
        cleanNutritionUi();
      })();
    </script>
  </body>
</html>
