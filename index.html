const $=s=>document.querySelector(s), store={get:k=>JSON.parse(localStorage.getItem('pump_'+k)||'null'),set:(k,v)=>localStorage.setItem('pump_'+k,JSON.stringify(v))};
let me=store.get('me'), modal=null, tab='home', step=0, water=4, tasks=[], photo=null;
let form=store.get('profile')||{name:'',sex:'female',age:27,height:165,startWeight:70,targetWeight:62,activity:'light',diet:''};
const logoTag=cls=>'<img class="logo '+(cls||'')+'" src="'+logo+'" alt="PUMP">';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function target(){let b=10*form.startWeight+6.25*form.height-5*form.age+(form.sex==='male'?5:-161),m={low:1.2,light:1.35,medium:1.5}[form.activity];return {cal:Math.max(1200,Math.round((b*m-400)/50)*50),pro:Math.round(form.startWeight*1.5)}}
function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function render(){const a=$('#app');if(!me){a.innerHTML=welcome();bindWelcome();return}if(!me.done){a.innerHTML=onboard();bindOnboard();return}a.innerHTML=app();bindApp()}
function welcome(){return '<main class="welcome"><section class="hero">'+logoTag()+'<h1>הפעם<br><strong>עושים את זה.</strong></h1><p>תזונה, אימונים ומעקב שמחזירים אותך למסלול — בלי קיצוניות ובלי לוותר על החיים.</p></section><section class="features"><article class="feature"><span class="icon">⌁</span><div><b>תפריט תזונה</b><small>מסגרת אישית שנוחה לחיות איתה</small></div></article><article class="feature"><span class="icon">⌁</span><div><b>תוכנית אימונים</b><small>צעדים ברורים שמתחילים מהיום</small></div></article><article class="feature"><span class="icon green">✓</span><div><b>מעטפת 360° להצלחה</b><small>מעקב, תמיכה ודחיפה כשצריך</small></div></article></section><div class="actions"><button class="primary" id="register">הרשמה <span>←</span></button><button class="soft" id="login">התחברות</button></div><p class="legal">המידע באפליקציה הוא כללי ואינו מחליף ייעוץ רפואי או תזונתי.</p></main>'}
function auth(kind){modal=kind;const is=kind==='login';document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" id="modal"><form class="modal" id="authForm"><button type="button" class="close" id="close">×</button>'+logoTag()+'<p class="kicker">'+(is?'טוב שחזרת':'מתחילים ביחד')+'</p><h2>'+ (is?'כניסה לחשבון':'יצירת חשבון')+'</h2><p>'+ (is?'הפרטים שלך כבר מחכים לך.':'בלי מייל ובלי פרטים מיותרים.')+'</p><label class="field">שם משתמש<input id="username" required minlength="3" placeholder="לפחות 3 תווים" autofocus></label><label class="field">סיסמה<input id="password" required minlength="6" type="password" placeholder="לפחות 6 תווים"></label><p class="error" id="authError"></p><button class="primary" style="width:100%">'+(is?'כניסה':'יצירת חשבון')+' <span>←</span></button><button type="button" class="switch" id="switch">'+(is?'אין לך חשבון? יוצרים אחד':'כבר יש חשבון? נכנסים')+'</button></form></div>');$('#close').onclick=closeModal;$('#switch').onclick=()=>{closeModal();auth(is?'register':'login')};$('#authForm').onsubmit=e=>{e.preventDefault();let u=$('#username').value.trim(),p=$('#password').value,users=store.get('users')||[];if(is){let found=users.find(x=>x.u===u&&x.p===p);if(!found)return $('#authError').textContent='שם המשתמש או הסיסמה לא נכונים.';me=found;form=found.profile||form}else{if(users.some(x=>x.u===u))return $('#authError').textContent='שם המשתמש כבר תפוס.';me={u,p,done:false,role:users.length?'member':'admin'};users.push(me);store.set('users',users)}store.set('me',me);closeModal();render()}}
function closeModal(){$('#modal')?.remove();modal=null}function bindWelcome(){$('#register').onclick=()=>auth('register');$('#login').onclick=()=>auth('login')}
function onboard(){const steps='<div class="steps">'+[0,1,2,3].map((_,i)=>'<i class="'+(i<=step?'active':'')+'"></i>').join('')+'</div>';let body='';if(step===0)body='<p class="kicker">המסלול שלך מתחיל כאן</p><h1>מה המטרה<br>שחשובה לך עכשיו?</h1><p class="lead">נבנה לך מסלול לירידה מדורגת במשקל, שאפשר לחיות איתו באמת.</p><div class="select-grid"><button class="choice active"><span><b>ירידה במשקל</b><small>מטרה ברורה, בקצב שמתאים לך</small></span>◉</button><button class="choice" disabled><span><b>עלייה במשקל</b><small>בקרוב</small></span>○</button></div><div class="gender"><button data-sex="female" class="'+(form.sex==='female'?'active':'')+'">אני אישה</button><button data-sex="male" class="'+(form.sex==='male'?'active':'')+'">אני גבר</button></div>';if(step===1)body='<p class="kicker">כדי לדייק את המסלול</p><h1>בואו נכיר<br>קצת יותר טוב.</h1><div class="inputs"><label class="field">איך קוראים לך?<input id="name" value="'+esc(form.name)+'" placeholder="השם שלך"></label><label class="field">גיל<input id="age" type="number" value="'+form.age+'"></label><label class="field">גובה (ס״מ)<input id="height" type="number" value="'+form.height+'"></label><label class="field">משקל נוכחי (ק״ג)<input id="weight" type="number" step=".1" value="'+form.startWeight+'"></label></div>';if(step===2)body='<p class="kicker">קובעים יעד</p><h1>לאן אתם<br>רוצים להגיע?</h1><label class="field">משקל יעד<input id="goal" type="number" step=".1" value="'+form.targetWeight+'"></label><p class="lead">איך נראה היום־יום שלך?</p><div class="activity-list">'+[['low','מעט תנועה','רוב היום בישיבה'],['light','תנועה קלה','הליכות או 1–3 אימונים בשבוע'],['medium','פעיל/ה','אימונים או תנועה ברוב הימים']].map(x=>'<button class="activity '+(form.activity===x[0]?'active':'')+'" data-act="'+x[0]+'"><span><b>'+x[1]+'</b><small>'+x[2]+'</small></span><i></i></button>').join('')+'</div>';if(step===3){let t=target();body='<p class="kicker">כמעט שם</p><h1>המסלול שלך<br><strong>מוכן להתחיל.</strong></h1><div class="summary"><div><span>יעד יומי</span><b>'+t.cal+'</b><span>קלוריות</span></div><div><span>יעד חלבון</span><b>'+t.pro+'</b><span>גרם</span></div><div><span>יעד משקל</span><b>'+form.targetWeight+'</b><span>ק״ג</span></div></div><label class="field">יש העדפות אוכל שחשוב שנכיר?<input id="diet" value="'+esc(form.diet)+'" placeholder="למשל: צמחוני/ת, ללא מוצרי חלב…"></label><section class="tip"><span>✓</span><p><b>זה לא תפריט קשיח.</b><br>המסלול נבנה כדי להשתלב בחיים שלך.</p></section>'}return '<main class="onboard"><header class="on-top">'+logoTag()+'<span>שלב '+(step+1)+' מתוך 4</span></header>'+steps+'<section>'+body+'</section><footer class="bottom-action">'+(step?'<button class="back" id="back">חזרה</button>':'')+'<button class="primary" id="next">'+(step===3?'לכניסה למסלול':'המשך')+' <span>←</span></button></footer></main>'}
function bindOnboard(){document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{form.sex=b.dataset.sex;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{form.activity=b.dataset.act;render()});$('#back')?.addEventListener('click',()=>{step--;render()});$('#next').onclick=()=>{if(step===1){form.name=$('#name').value.trim();form.age=+$('#age').value;form.height=+$('#height').value;form.startWeight=+$('#weight').value;if(!form.name)return toast('צריך רק שם כדי להמשיך.')}if(step===2)form.targetWeight=+$('#goal').value;if(step===3){form.diet=$('#diet').value;me.done=true;me.profile=form;let us=store.get('users')||[];store.set('users',us.map(x=>x.u===me.u?me:x));store.set('me',me);store.set('profile',form);toast('המסלול האישי שלך מוכן.');return render()}step++;render()}}
function app(){let p=me.profile||form,w=store.get('weights')||[],last=w.at(-1)?.weight||p.startWeight,t=target(),lost=Math.max(0,p.startWeight-last),left=Math.max(0,last-p.targetWeight);const nav='<nav class="nav">'+[['home','⌂','היום'],['food','◒','תזונה'],['progress','↗','התקדמות'],['camera','◉','צילום אוכל']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</nav>';let content='';if(tab==='home')content='<p class="day">'+new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date())+'</p><h1>בוקר טוב, '+esc(p.name)+' <strong>✦</strong></h1><p class="subtitle">ממשיכים מהנקודה שבה עצרנו. בלי דרמה, פשוט עקביות.</p><section class="daily"><div class="daily-head"><div><small>המסגרת שלך להיום</small><b>'+t.cal+' <small style="display:inline">קלוריות</small></b></div><div class="ring"><strong>0</strong><small>נאכלו</small></div></div><div class="divider"></div><div class="metrics"><span><b>0</b> / '+t.pro+'<small>חלבון</small></span><span><b id="waterN">'+water+'</b> / 8<small>כוסות מים</small></span></div><div class="water"><button id="less">−</button>'+Array.from({length:8},(_,i)=>'<i class="'+(i<water?'full':'')+'"></i>').join('')+'<button id="more">+</button></div></section><section class="section-title"><span><small>להיום</small><h2>שלושה צעדים קטנים</h2></span><b id="count">'+tasks.length+'/3</b></section><div class="tasks">'+[['breakfast','☼','ארוחה ראשונה','מתחילים עם חלבון'],['walk','⌁','תנועה','20 דקות זה בדיוק מספיק'],['check','✦','צ׳ק־אין ערב','דקה להבין את היום']].map(x=>'<button class="task '+(tasks.includes(x[0])?'done':'')+'" data-task="'+x[0]+'"><span class="task-icon">'+(tasks.includes(x[0])?'✓':x[1])+'</span><span><b>'+x[2]+'</b><small>'+x[3]+'</small></span><em>‹</em></button>').join('')+'</div><section class="tip"><span>✦</span><p><b>המאמן שלך אומר:</b> יום פחות מדויק לא מקלקל תהליך. הארוחה הבאה היא תמיד הזדמנות לחזור למסלול.</p></section>';if(tab==='food')content='<p class="kicker">תזונה פשוטה</p><h1>לא דיאטה.<br><strong>מסגרת לחיים.</strong></h1><p class="subtitle">הבסיס שלך לכל ארוחה: חלבון, פחמימה וירקות. לא צריך לספור כל דבר כדי להתחיל טוב.</p><section class="plate-card"><div class="plate"></div><div><h2>כך בונים צלחת</h2><p>חצי ירקות, רבע חלבון, רבע פחמימה. זו נקודת התחלה, לא עונש.</p></div></section><article class="meal"><b>בוקר</b><h3>חלבון לפתיחה</h3><p>ביצים, יוגורט, גבינה, כריך עם טונה או מה שמתאים לך.</p></article><article class="meal"><b>צהריים וערב</b><h3>צלחת מאוזנת</h3><p>עוף, דג, טופו או קטניות, לצד תוספת וירקות.</p></article><article class="meal"><b>גם לזה יש מקום</b><h3>מתוק מתוכנן</h3><p>לא “נשברת” — בוחרת מראש ונהנית בלי רגשות אשם.</p></article>';if(tab==='progress')content='<p class="kicker">התקדמות אמיתית</p><h1>מסתכלים על<br><strong>המגמה, לא על יום.</strong></h1><section class="stats"><div><small>משקל נוכחי</small><b>'+last+'<small>ק״ג</small></b></div><div><small>ירדת עד כה</small><b class="success">'+lost.toFixed(1)+'<small>ק״ג</small></b></div><div><small>נשאר ליעד</small><b>'+left.toFixed(1)+'<small>ק״ג</small></b></div></section><section class="chart"><header class="chart-head"><div><small>המדד שלך</small><h2>שקילות</h2></div><button id="weigh">+ שקילה</button></header><div class="bars">'+(w.length?w.map((x,i)=>'<div class="bar-item"><div class="bar" style="height:'+Math.max(24,Math.min(92,42+(x.weight-p.targetWeight)*9))+'px"></div><b>'+x.weight+'</b><small>'+x.date.slice(5).replace('-','/')+'</small></div>').join(''):'<p class="empty-chart">אחרי השקילה הראשונה יופיע כאן הגרף שלך.</p>')+'</div></section><section class="tip"><span>↗</span><p><b>טיפ:</b> הכי נכון להישקל פעם בשבוע, בבוקר ובאותם תנאים.</p></section>';if(tab==='camera')content='<p class="kicker">צילום אוכל</p><h1>רוצים להבין<br><strong>מה יש בצלחת?</strong></h1><p class="subtitle">מצלמים ארוחה, והמערכת תעזור להעריך את המרכיבים והקלוריות.</p><label class="camera" id="camera">'+(photo?'<img src="'+photo+'">':'<span>⌁</span><b>צלמו או העלו תמונה</b><small>חשוב שהצלחת תהיה מוארת וברורה</small>')+'<input id="photo" type="file" accept="image/*" capture="environment"></label><p class="hint"><b>כדי שנדייק:</b><br>צלמו מלמעלה · בלי פילטר · צלחת אחת בכל תמונה</p>';if(tab==='profile')content='<p class="kicker">החשבון שלי</p><h1>'+esc(p.name)+',<br><strong>המסלול שלך בידיים טובות.</strong></h1><section class="account"><div class="profile-avatar">'+esc(p.name[0])+'</div><div><b>'+esc(p.name)+'</b><span>@'+esc(me.u)+'</span><small>יעד: '+p.targetWeight+' ק״ג</small></div></section><div class="settings"><button id="edit">✎ <span>עריכת הפרטים והיעד</span><i>‹</i></button><button id="logout">↪ <span>התנתקות</span><i>‹</i></button></div>';return '<main><header class="app-top">'+logoTag()+'<div class="top-actions"><button class="orb" id="ai">✦</button><button class="avatar" id="profile">'+esc(p.name[0])+'</button></div></header><section class="screen">'+content+'</section>'+nav+'</main>'}
function bindApp(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#profile')?.addEventListener('click',()=>{tab='profile';render()});$('#less')?.addEventListener('click',()=>{water=Math.max(0,water-1);render()});$('#more')?.addEventListener('click',()=>{water=Math.min(8,water+1);render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let id=b.dataset.task;tasks=tasks.includes(id)?tasks.filter(x=>x!==id):[...tasks,id];render()});$('#weigh')?.addEventListener('click',()=>weightModal());$('#photo')?.addEventListener('change',e=>{let f=e.target.files[0];if(f){photo=URL.createObjectURL(f);render()}});$('#edit')?.addEventListener('click',()=>{step=1;me.done=false;render()});$('#logout')?.addEventListener('click',()=>{store.set('me',null);me=null;form=store.get('profile')||form;tab='home';render()});$('#ai')?.addEventListener('click',()=>toast('המאמן החכם יתחבר בשלב הבא.'))}
function weightModal(){document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" id="modal"><form class="modal" id="weightForm"><button type="button" class="close" id="close">×</button><p class="kicker">שקילה חדשה</p><h2>מה המשקל שלך היום?</h2><label class="field"><input id="newWeight" required type="number" step=".1" inputmode="decimal" placeholder="'+(store.get('weights')||[]).at(-1)?.weight+'"></label><button class="primary" style="width:100%">שמירת שקילה <span>←</span></button></form></div>');$('#close').onclick=closeModal;$('#weightForm').onsubmit=e=>{e.preventDefault();let w=store.get('weights')||[];w.push({weight:+$('#newWeight').value,date:new Date().toISOString().slice(0,10)});store.set('weights',w);closeModal();render();toast('השקילה נשמרה בהתקדמות שלך.')}}
render();
</script></body></html>
