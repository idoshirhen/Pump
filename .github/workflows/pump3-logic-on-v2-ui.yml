name: PUMP 3 Logic on PUMP 2 UI

on:
  push:
    branches: [pump3-logic-on-v2-ui]
  pull_request:
    branches: [main]

jobs:
  logic-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove PUMP 2 visual surface is frozen
        run: node scripts/test-pump3-visual-freeze.mjs

      - name: Syntax check PUMP 3 logic adapters
        run: |
          node --check assets/pump-nutrition-accuracy-v1.js
          node --check assets/pump3-core-logic-v1.js
          node --check scripts/apply-pump3-logic-adapter.mjs

      - name: Verify PUMP 3 source-backed nutrition rows
        run: node scripts/test-pump3-logic-on-v2-ui.mjs

      - name: Verify PUMP 3 target and training rules
        run: node scripts/test-pump3-core-logic.mjs

      - name: Verify unchanged legacy runtime scripts still parse
        run: |
          node --check assets/pump-workout-timer-v1.js
          node --check assets/pump-meal-structure-native-preview.js
          node --check assets/pump-exercise-media-v1.js
          node --check assets/pump-exercise-coverage-v1.js
          node --check assets/pump-mobile-ui-v1.js
