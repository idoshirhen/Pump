name: PUMP 3 Audit Tests

on:
  push:
    branches: [pump-3-audit]
  pull_request:
    branches: [main]

jobs:
  personalization-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check helper personalization matrix
        run: node scripts/test-personalization-helpers.mjs

      - name: Audit exercise media coverage
        run: node scripts/audit-exercise-media.mjs

      - name: Audit legacy nutrition catalog
        run: node scripts/audit-nutrition-catalog.mjs

      - name: Audit PUMP 3 legacy food migration
        run: node scripts/audit-pump3-food-migration.mjs

      - name: Check PUMP 3 nutrition engine
        run: node pump3/tests/nutrition-engine.test.mjs

      - name: Check PUMP 3 official nutrition source adapter
        run: node pump3/tests/nutrition-source.test.mjs

      - name: Check first verified canonical food batch
        run: node pump3/tests/official-foods-v1.test.mjs

      - name: Check combined verified canonical food library
        run: node pump3/tests/canonical-foods.test.mjs

      - name: Enforce section 2 verification progress
        run: node pump3/tests/section2-progress.test.mjs

      - name: Check deterministic meal targeting
        run: node pump3/tests/meal-targeting.test.mjs

      - name: Enforce section 2 completion contract
        run: node pump3/tests/section2-completion.test.mjs

      - name: Audit meal coverage using verified nutrition only
        run: node scripts/audit-pump3-meal-verification.mjs

      - name: Match ready legacy foods to official Ministry of Health rows
        run: node scripts/fetch-moh-food-candidates.mjs

      - name: Upload official food matching report
        uses: actions/upload-artifact@v4
        with:
          name: pump3-moh-food-matches
          path: pump3/audit/*.json
          if-no-files-found: error

      - name: Check legacy runtime contract
        run: node scripts/test-legacy-runtime-contract.mjs

      - name: Syntax-check runtime patch scripts
        run: |
          node --check assets/pump-nutrition-accuracy-v1.js
          node --check assets/pump-exercise-media-v1.js
          node --check assets/pump-exercise-coverage-v1.js
          node --check assets/pump-mobile-ui-v1.js
          node --check assets/pump-meal-structure-native-preview.js

      # The old scripts/test-personalization.mjs boots a compiled browser bundle in JSDOM.
      # It currently times out before onboarding because the production bundle depends on
      # browser/auth lifecycle behavior JSDOM does not reproduce. Keeping that as a required
      # gate produced false-red CI, so it is intentionally excluded until replaced by a real
      # browser E2E suite for PUMP 3.
