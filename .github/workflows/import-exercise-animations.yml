name: Import exercise animations

on:
  push:
    branches:
      - pump-exercise-upload
    paths:
      - 'exercise-upload/**'
      - '.github/workflows/import-exercise-animations.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          ref: pump-exercise-upload
          fetch-depth: 0

      - name: Expand WebP animations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(exercise-upload/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo 'No upload archives left to process.'
            exit 0
          fi
          rm -rf /tmp/pump-exercises
          mkdir -p /tmp/pump-exercises assets/exercises
          for z in "${zips[@]}"; do
            unzip -o "$z" -d /tmp/pump-exercises
          done
          cp -f /tmp/pump-exercises/exercises/*.webp assets/exercises/
          rm -rf exercise-upload

      - name: Commit imported animations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Add 19 exercise animations'
          git push origin HEAD:pump-exercise-upload
